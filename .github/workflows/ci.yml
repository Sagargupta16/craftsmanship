name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skills:
    name: Lint skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Conformance suite for the Agent Skills SKILL.md spec.
      # Fails on missing/duplicate frontmatter, bad names, malformed files.
      - name: skillcheck lint
        run: npx -y @sagargupta1610/skillcheck lint ./skills

  links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Inputs are listed explicitly rather than globbed, because CLAUDE.md
      # links to the parent workspace this repo lives in and those paths do
      # not exist inside the repo. Keep this list in step with new docs.
      - name: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            'README.md'
            'CONTRIBUTING.md'
            'CHANGELOG.md'
            './skills/**/*.md'
